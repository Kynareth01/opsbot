[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "opsbot"
version = "0.1.0"
description = "AI-powered DevOps automation — monitoring, diagnostics, and auto-remediation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Kynareth01"},
]
keywords = ["devops", "monitoring", "automation", "remediation", "playbooks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "psutil>=5.9.0",
    "pyyaml>=6.0",
    "streamlit>=1.28.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
opsbot = "opsbot.app:main"

[tool.setuptools.packages.find]
include = ["opsbot*"]
